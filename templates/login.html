<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Portal do Torneio</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body{display:flex; align-items:center; justify-content:center; min-height:100vh;}
  .login-box{width:100%; max-width:360px;}
  .login-box h1{text-align:center; margin-bottom:4px;}
  .login-box .sub{text-align:center; color:var(--text-muted); font-size:13px; margin-bottom:20px;}
  .error{color:var(--loss); font-size:13px; margin-top:8px; text-align:center; min-height:18px;}
</style>
</head>
<body>
  <div class="login-box">
    <h1>Portal do Torneio</h1>
    <div class="sub">Xadrez Escolar</div>
    <div class="panel">
      <label>Usuário</label>
      <input id="username" autocomplete="username">
      <div style="height:10px;"></div>
      <label>Senha</label>
      <input id="password" type="password" autocomplete="current-password">
      <div style="margin-top:16px;"><button class="btn" style="width:100%;" onclick="doLogin()">Entrar</button></div>
      <div class="error" id="err"></div>
    </div>
  </div>
<script>
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
async function doLogin(){
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  try{
    const res = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username,password})});
    const data = await res.json();
    if(!res.ok){ errEl.textContent = data.error || 'Erro ao entrar'; return; }
    window.location.href = '/';
  }catch(e){ errEl.textContent = 'Erro de conexão'; }
}
</script>
</body>
</html>
