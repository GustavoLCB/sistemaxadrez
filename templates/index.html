<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal do Torneio — Xadrez Escolar (versão Flask)</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="app">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
    <h1>Portal do Torneio — Xadrez Escolar <span style="font-size:13px; color:var(--text-muted);">(versão Flask/SQLite)</span></h1>
    <button class="btn secondary" onclick="doLogout()">Sair</button>
  </div>
  <nav id="tabs"></nav>
  <div id="content"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const TABS = [
  {id:'categorias', label:'Categorias'},
  {id:'grupos', label:'Grupos'},
  {id:'atletas', label:'Atletas'},
  {id:'rodadas', label:'Rodadas'},
  {id:'classificacao', label:'Classificação'},
  {id:'fiscais', label:'Fiscais'},
  {id:'publico', label:'Quadro Público'},
  {id:'historico', label:'Histórico'},
  {id:'explicacoes', label:'Explicações/Regras'},
];
let ui = { tab:'categorias', roundsGroup:null, standGroup:null, athleteSearch:'', athletePage:0, historyQuery:'' };
let cache = { categories:[], groups:[], athletes:[], rules:[], users:[] };

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
async function api(path, opts){
  const res = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if(res.status === 401){ window.location.href = '/login'; throw new Error('não autenticado'); }
  const data = await res.json().catch(()=>({}));
  if(!res.ok){ toast(data.error || 'Erro'); throw new Error(data.error||'erro'); }
  return data;
}
async function doLogout(){ await api('/api/logout', {method:'POST'}); window.location.href = '/login'; }
async function refreshCache(){
  cache.categories = await api('/api/categories');
  cache.groups = await api('/api/groups');
  cache.athletes = await api('/api/athletes');
  cache.rules = await api('/api/category-rules');
  cache.users = await api('/api/users');
}
function catById(id){ return cache.categories.find(c=>c.id===id); }
function groupsOf(catId, gender){ return cache.groups.filter(g=>g.category_id===catId && g.gender===gender); }

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="${ui.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function switchTab(id){ ui.tab=id; render(); }

async function render(){
  renderTabs();
  const c = document.getElementById('content');
  await refreshCache();
  if(ui.tab==='categorias') c.innerHTML = renderCategorias();
  else if(ui.tab==='grupos') c.innerHTML = renderGrupos();
  else if(ui.tab==='atletas') c.innerHTML = renderAtletas();
  else if(ui.tab==='rodadas') c.innerHTML = await renderRodadas();
  else if(ui.tab==='classificacao') c.innerHTML = await renderClassificacao();
  else if(ui.tab==='fiscais') c.innerHTML = renderFiscais();
  else if(ui.tab==='publico') c.innerHTML = await renderQuadroPublico();
  else if(ui.tab==='historico') c.innerHTML = await renderHistorico();
  else if(ui.tab==='explicacoes') c.innerHTML = renderExplicacoes();
}

function renderCategorias(){
  return `
  <div class="panel">
    <h2>Faixas de idade → categoria</h2>
    <p class="desc">Categoria nunca leva gênero no nome (ex: "Sub-14", nunca "Sub14-FEM").</p>
    <div class="grid cols-4">
      <div><label>Nome</label><input id="rule-name" placeholder="Sub-9"></div>
      <div><label>Idade mín</label><input id="rule-min" type="number"></div>
      <div><label>Idade máx</label><input id="rule-max" type="number"></div>
      <div style="display:flex; align-items:flex-end;"><button class="btn" style="width:100%;" onclick="addRule()">Adicionar</button></div>
    </div>
    ${cache.rules.length? `<table style="margin-top:14px;"><thead><tr><th>Categoria</th><th>Faixa</th><th></th></tr></thead><tbody>
      ${cache.rules.map(r=>{const cat=catById(r.category_id); return `<tr><td>${cat?cat.name:'—'}</td><td>${r.min_age}-${r.max_age}</td><td><button class="btn danger" onclick="delRule('${r.id}')">Remover</button></td></tr>`;}).join('')}
    </tbody></table>` : '<div class="empty">Nenhuma faixa cadastrada.</div>'}
  </div>
  <div class="panel">
    <h2>Categorias (${cache.categories.length})</h2>
    ${cache.categories.length? `<table><thead><tr><th>Nome</th><th></th></tr></thead><tbody>
      ${cache.categories.map(c=>`<tr><td>${c.name}</td><td><button class="btn danger" onclick="delCat('${c.id}')">Remover</button></td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">Nenhuma categoria.</div>'}
  </div>`;
}
async function addRule(){
  const name = document.getElementById('rule-name').value;
  const minAge = document.getElementById('rule-min').value;
  const maxAge = document.getElementById('rule-max').value;
  try{ await api('/api/category-rules', {method:'POST', body:JSON.stringify({name,minAge,maxAge})}); render(); }catch(e){}
}
async function delRule(id){ try{ await api('/api/category-rules/'+id, {method:'DELETE'}); render(); }catch(e){} }
async function delCat(id){ try{ await api('/api/categories/'+id, {method:'DELETE'}); render(); }catch(e){} }

function renderGrupos(){
  return `
  <div class="panel">
    <h2>Criar grupo manualmente</h2>
    <div class="grid cols-4">
      <div><label>Categoria</label><select id="grp-cat">${cache.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div><label>Gênero</label><select id="grp-gender"><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
      <div><label>Nome</label><input id="grp-name" placeholder="Grupo A"></div>
      <div><label>Máx. de rodadas (opcional)</label><input id="grp-maxrounds" type="number" placeholder="sem limite"></div>
    </div>
    <div style="margin-top:10px;"><button class="btn" onclick="addGroup()">Criar</button></div>
  </div>
  <div class="panel">
    <h2>Dividir automaticamente em N grupos (seed em cobra)</h2>
    <div class="grid cols-4">
      <div><label>Categoria</label><select id="split-cat">${cache.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div><label>Gênero</label><select id="split-gender"><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
      <div><label>Nº de grupos</label><input id="split-n" type="number" value="2"></div>
      <div style="display:flex; align-items:flex-end;"><button class="btn secondary" style="width:100%;" onclick="autoSplit()">Dividir</button></div>
    </div>
  </div>
  <div class="panel">
    <h2>Grupos (${cache.groups.length})</h2>
    <p class="desc">"Máx. rodadas" limita o torneio suíço daquele grupo a um número fixo de rodadas, mesmo que ainda daria para gerar mais — clique no número para editar.</p>
    ${cache.groups.length? `<table><thead><tr><th>Categoria</th><th>Gênero</th><th>Grupo</th><th>Atletas</th><th>Máx. rodadas</th><th></th></tr></thead><tbody>
      ${cache.groups.map(g=>{
        const cat=catById(g.category_id);
        const count = cache.athletes.filter(a=>a.group_id===g.id).length;
        return `<tr><td>${g.category_name||(cat?cat.name:'—')}</td><td>${g.gender}</td><td>${g.name}</td><td>${count}</td>
          <td><input type="number" value="${g.max_rounds??''}" placeholder="sem limite" style="width:100px;" onchange="setMaxRounds('${g.id}', this.value)"></td>
          <td><button class="btn danger" onclick="delGroup('${g.id}')">Remover</button></td></tr>`;
      }).join('')}
    </tbody></table>` : '<div class="empty">Nenhum grupo.</div>'}
  </div>`;
}
async function addGroup(){
  const categoryId = document.getElementById('grp-cat').value;
  const gender = document.getElementById('grp-gender').value;
  const name = document.getElementById('grp-name').value;
  const maxRounds = document.getElementById('grp-maxrounds').value;
  try{ await api('/api/groups', {method:'POST', body:JSON.stringify({categoryId,gender,name,maxRounds})}); render(); }catch(e){}
}
async function setMaxRounds(id, value){
  try{ await api('/api/groups/'+id, {method:'PATCH', body:JSON.stringify({maxRounds: value})}); toast('Limite de rodadas atualizado.'); render(); }catch(e){}
}
async function delGroup(id){ try{ await api('/api/groups/'+id, {method:'DELETE'}); render(); }catch(e){} }
async function autoSplit(){
  const categoryId = document.getElementById('split-cat').value;
  const gender = document.getElementById('split-gender').value;
  const n = document.getElementById('split-n').value;
  try{ const r = await api('/api/groups/auto-split', {method:'POST', body:JSON.stringify({categoryId,gender,n:Number(n)})}); toast(r.summary.join(' · ')); render(); }catch(e){}
}

function renderAtletas(){
  return `
  <div class="panel">
    <h2>Novo atleta (cadastro individual)</h2>
    <div class="grid cols-4">
      <div><label>Nome completo</label><input id="af-name"></div>
      <div><label>Gênero</label><select id="af-gender"><option value="M">M</option><option value="F">F</option></select></div>
      <div><label>Categoria</label><select id="af-cat">${cache.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></div>
      <div><label>Faixa (K)</label><select id="af-k"><option value="iniciante">Iniciante (K=40)</option><option value="regular">Regular (K=20)</option><option value="mestre">Mestre (K=10)</option></select></div>
    </div>
    <div class="grid cols-4" style="margin-top:10px;">
      <div><label>CPF (opcional, mas recomendado)</label><input id="af-cpf" placeholder="000.000.000-00"></div>
    </div>
    <p class="desc" style="margin-top:6px;">O CPF, quando informado, funciona como identificador único do atleta — evita duplicar a mesma pessoa em importações futuras e permite acompanhá-la com segurança em outros torneios ao longo do ano, mesmo que o nome seja digitado de forma um pouco diferente.</p>
    <div style="margin-top:10px;"><button class="btn" onclick="addAthlete()">Adicionar</button></div>
  </div>

  <div class="panel" style="${cache.rules.length===0 ? 'border:1px solid var(--gold);' : ''}">
    <h2>Importação em massa (Excel / CSV)</h2>
    ${cache.rules.length===0 ? `
      <p class="desc" style="color:var(--gold-soft, #e4c584); background:rgba(201,160,78,0.1); padding:10px; border-radius:8px;">
        ⚠️ <b>Você ainda não cadastrou nenhuma faixa de idade → categoria.</b> Vá na aba <b>Categorias</b> e crie ao menos uma
        (ex: "Sub-9" de 7 a 9 anos) antes de importar — sem isso, todos os atletas importados cairão numa categoria genérica
        de "sem categoria" e você vai precisar movê-los manualmente depois.
      </p>` : ''}
    <p class="desc">Planilha com colunas Nome, Idade, Colégio (e opcionalmente Gênero, CPF). A categoria de cada atleta é
    definida automaticamente pela idade, usando as faixas cadastradas na aba Categorias — cadastre-as antes de importar.
    Se um grupo ainda não existir para a combinação categoria+gênero, ele é criado sozinho, dividindo os atletas em
    grupos do tamanho que você definir abaixo. Quando a planilha tem CPF, ele é usado para não duplicar o mesmo atleta
    em importações repetidas — mais confiável do que comparar só pelo nome.</p>
    <div class="grid cols-4">
      <div><label>Gênero padrão (se a planilha não tiver essa coluna)</label><select id="imp-gender"><option value="M">Masculino</option><option value="F">Feminino</option></select></div>
      <div><label>Faixa padrão (K)</label><select id="imp-k"><option value="iniciante">Iniciante (K=40)</option><option value="regular">Regular (K=20)</option><option value="mestre">Mestre (K=10)</option></select></div>
      <div><label>Rating inicial padrão</label><input id="imp-rating" type="number" value="1500"></div>
      <div><label>Atletas por grupo</label><input id="imp-groupsize" type="number" value="25"></div>
    </div>
    <div style="margin-top:10px;"><input type="file" id="imp-file" accept=".xlsx,.xls,.csv" onchange="handleImportFile(this)"></div>
    <div id="imp-status" class="desc" style="margin-top:8px;"></div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <h2 style="margin:0;">Atletas (${cache.athletes.length})</h2>
      <input id="athlete-search" placeholder="Buscar por nome ou colégio…" style="max-width:260px;" oninput="ui.athleteSearch=this.value; renderAthletesTableOnly();">
    </div>
    <div id="athletes-table-wrap">${renderAthletesTable()}</div>
  </div>

  <div class="panel" style="border:1px solid var(--loss);">
    <h2 style="color:var(--loss);">Zona de Perigo</h2>
    <p class="desc">Use isto se importou um arquivo errado e precisa recomeçar. Todas as ações abaixo pedem que você
    digite <b>APAGAR</b> para confirmar, e não podem ser desfeitas.</p>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn danger" onclick="dangerAction('delete-all-athletes','Remover TODOS os atletas (grupos e categorias continuam existindo, vazios)')">Remover todos os atletas</button>
      <button class="btn danger" onclick="dangerAction('delete-all-groups','Remover TODOS os grupos (os atletas continuam existindo, sem grupo)')">Remover todos os grupos</button>
      <button class="btn danger" onclick="dangerAction('delete-everything','Reiniciar TUDO: atletas, grupos, categorias e faixas de idade (os logins de fiscais continuam existindo)')">Reiniciar tudo</button>
    </div>
  </div>`;
}
async function dangerAction(endpoint, description){
  const msg = `Isto vai: ${description}.\n\nEssa ação NÃO PODE ser desfeita.\n\nPara confirmar, digite exatamente: APAGAR`;
  const typed = prompt(msg);
  if(typed === null) return;
  if(typed !== 'APAGAR'){ toast('Confirmação incorreta — nada foi removido.'); return; }
  try{
    const r = await api('/api/danger/'+endpoint, {method:'POST', body: JSON.stringify({confirm:'APAGAR'})});
    toast('Feito.');
    render();
  }catch(e){}
}
function renderAthletesTable(){
  const q = (ui.athleteSearch||'').trim().toLowerCase();
  const filtered = cache.athletes.filter(a=>{
    if(!q) return true;
    return a.full_name.toLowerCase().includes(q) || (a.school||'').toLowerCase().includes(q) || (a.cpf||'').includes(q.replace(/\D/g,''));
  });
  const page = ui.athletePage||0;
  const pageSize = 100;
  const pageItems = filtered.slice(page*pageSize, (page+1)*pageSize);
  const totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  const formatCpf = (c)=> c ? c.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : '—';
  const rows = pageItems.map(a=>{
    const cat=catById(a.category_id);
    const grpOpts = groupsOf(a.category_id, a.gender).map(g=>`<option value="${g.id}" ${a.group_id===g.id?'selected':''}>${g.name}</option>`).join('');
    return `<tr><td>${a.full_name}</td><td>${a.gender}</td><td>${a.age??'—'}</td><td>${a.school||'—'}</td><td style="font-family:monospace; font-size:12px;">${formatCpf(a.cpf)}</td><td>${cat?cat.name:'—'}</td><td>${a.rating}</td>
      <td><select onchange="assignGroup('${a.id}', this.value)"><option value="">Sem grupo</option>${grpOpts}</select></td>
      <td><button class="btn danger" onclick="delAthlete('${a.id}')">Remover</button></td></tr>`;
  }).join('');
  const pager = `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:13px; color:var(--text-muted);">
    <span>Mostrando ${pageItems.length} de ${filtered.length} (página ${page+1} de ${totalPages})</span>
    <span><button class="btn secondary" ${page<=0?'disabled':''} onclick="changeAthletePage(-1)">← Anterior</button>
    <button class="btn secondary" ${page>=totalPages-1?'disabled':''} onclick="changeAthletePage(1)">Próxima →</button></span>
  </div>`;
  return filtered.length===0 ? '<div class="empty">Nenhum atleta encontrado.</div>' :
    `<table><thead><tr><th>Nome</th><th>Gên.</th><th>Idade</th><th>Colégio</th><th>CPF</th><th>Categoria</th><th>Rating</th><th>Grupo</th><th></th></tr></thead><tbody>${rows}</tbody></table>${pager}`;
}
function renderAthletesTableOnly(){
  ui.athletePage = 0;
  const wrap = document.getElementById('athletes-table-wrap');
  if(wrap) wrap.innerHTML = renderAthletesTable();
}
function changeAthletePage(delta){
  ui.athletePage = (ui.athletePage||0) + delta;
  document.getElementById('athletes-table-wrap').innerHTML = renderAthletesTable();
}

function normHeader(h){ return String(h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function findCol(headers, candidates){
  const norm = headers.map(normHeader);
  for(const cand of candidates){
    const idx = norm.findIndex(h=> h===cand || h.includes(cand));
    if(idx!==-1) return idx;
  }
  return -1;
}
function handleImportFile(input){
  const statusEl = document.getElementById('imp-status');
  const defaultGender = document.getElementById('imp-gender').value;
  const kFlag = document.getElementById('imp-k').value;
  const rating = Number(document.getElementById('imp-rating').value)||1500;
  const groupSize = Number(document.getElementById('imp-groupsize').value)||25;
  const file = input.files[0];
  if(!file) return;
  if(typeof XLSX==='undefined'){ statusEl.textContent='Biblioteca de planilhas não carregou. Verifique sua conexão.'; return; }
  statusEl.textContent = 'Lendo arquivo…';
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rowsRaw = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
      if(!rowsRaw.length){ statusEl.textContent='Planilha vazia.'; return; }
      const headers = rowsRaw[0];
      const nameIdx = findCol(headers, ['nome completo','nome','atleta']);
      const ageIdx = findCol(headers, ['idade','anos']);
      const schoolIdx = findCol(headers, ['colegio','escola','instituicao']);
      const genderIdx = findCol(headers, ['genero','sexo']);
      const cpfIdx = findCol(headers, ['cpf']);
      if(nameIdx===-1){ statusEl.textContent='Não encontrei coluna de nome.'; return; }
      const rows = [];
      for(let i=1;i<rowsRaw.length;i++){
        const r = rowsRaw[i];
        const fullName = String(r[nameIdx]||'').trim();
        if(!fullName) continue;
        let gender = null;
        if(genderIdx!==-1){
          const raw = String(r[genderIdx]||'').trim().toUpperCase();
          if(raw.startsWith('F')) gender='F'; else if(raw.startsWith('M')) gender='M';
        }
        rows.push({
          fullName, gender,
          age: ageIdx!==-1 && r[ageIdx]!=='' ? Number(r[ageIdx]) : null,
          school: schoolIdx!==-1 ? String(r[schoolIdx]||'').trim() : '',
          cpf: cpfIdx!==-1 ? String(r[cpfIdx]||'').trim() : ''
        });
      }
      statusEl.textContent = `Enviando ${rows.length} atleta(s)…`;
      const result = await api('/api/athletes/import', {method:'POST', body: JSON.stringify({
        rows, defaultGender, kFlag, rating, groupSize
      })});
      statusEl.textContent = `Concluído: ${result.added} atleta(s) importado(s), ${result.groupsCreated} grupo(s) criado(s) automaticamente${result.skipped?`, ${result.skipped} duplicado(s) ignorado(s)`:''}${result.unmatched?`, ${result.unmatched} sem idade correspondente a nenhuma faixa (caíram em "Sem categoria")`:''}${result.invalidCpf?`, ${result.invalidCpf} CPF(s) inválido(s) ignorado(s) (atleta foi importado mesmo assim, só sem o CPF)`:''}.`;
      render();
    }catch(err){
      console.error(err);
      statusEl.textContent = 'Não foi possível ler este arquivo. Confira o formato (.xlsx, .xls ou .csv).';
    }
  };
  reader.readAsArrayBuffer(file);
}
async function addAthlete(){
  const fullName = document.getElementById('af-name').value;
  const gender = document.getElementById('af-gender').value;
  const categoryId = document.getElementById('af-cat').value;
  const kFlag = document.getElementById('af-k').value;
  const cpf = document.getElementById('af-cpf').value;
  try{
    await api('/api/athletes', {method:'POST', body:JSON.stringify({fullName,gender,categoryId,kFlag,rating:1500,cpf})});
    document.getElementById('af-cpf').value='';
    render();
  }catch(e){}
}
async function assignGroup(id, groupId){ try{ await api('/api/athletes/'+id, {method:'PATCH', body:JSON.stringify({groupId: groupId||null})}); render(); }catch(e){} }
async function delAthlete(id){ try{ await api('/api/athletes/'+id, {method:'DELETE'}); render(); }catch(e){} }

async function renderRodadas(){
  if(!ui.roundsGroup && cache.groups.length) ui.roundsGroup = cache.groups[0].id;
  const options = cache.groups.map(g=>{const cat=catById(g.category_id); return `<option value="${g.id}" ${ui.roundsGroup===g.id?'selected':''}>${g.category_name||(cat?cat.name:'')} · ${g.gender} · ${g.name}</option>`;}).join('');
  let body = '<div class="empty">Crie um grupo.</div>';
  if(ui.roundsGroup){
    const group = cache.groups.find(g=>g.id===ui.roundsGroup);
    const rounds = await api('/api/groups/'+ui.roundsGroup+'/rounds');
    const groupAthletes = cache.athletes.filter(a=>a.group_id===ui.roundsGroup);
    const limitReached = group && group.max_rounds && rounds.length >= group.max_rounds;
    const limitLabel = group && group.max_rounds ? `${rounds.length} de ${group.max_rounds} rodada(s)` : `${rounds.length} rodada(s), sem limite definido`;

    const byeOptions = groupAthletes.map(a=>`<option value="${a.id}">${a.full_name}</option>`).join('');
    body = `
      <div class="grid cols-3" style="margin-bottom:10px; align-items:flex-end;">
        <div><label>BYE manual nesta próxima rodada (opcional)</label>
          <select id="rd-forced-bye"><option value="">Nenhum — deixar automático</option>${byeOptions}</select>
        </div>
        <div style="display:flex; flex-direction:column; gap:4px;">
          <span class="desc" style="margin:0;">${limitLabel}</span>
          <button class="btn" ${limitReached?'disabled':''} onclick="genRound()">Gerar próxima rodada</button>
        </div>
      </div>
      ${limitReached ? `<p class="desc" style="color:var(--gold-soft, #e4c584);">Este grupo atingiu o limite de rodadas configurado — ajuste em Grupos se quiser liberar mais.</p>` : ''}
    `;
    body += rounds.length===0 ? '<div class="empty">Nenhuma rodada ainda.</div>' :
      rounds.slice().reverse().map((rnd,i)=>{
        const roundNumber = rnd[0]?.roundNumber;
        const isLast = i===0;
        return `<div style="margin-top:10px;"><div style="display:flex; justify-content:space-between; align-items:center;">
            <b>Rodada ${roundNumber}</b>
            ${isLast ? `<button class="btn danger" style="font-size:11.5px; padding:4px 10px;" onclick="undoLastRound()">Desfazer esta rodada</button>` : ''}
          </div>` + rnd.map(m=>{
          if(m.isBye){ const a = cache.athletes.find(x=>x.id===m.byeAthleteId); return `<div class="match-row"><div>${a?a.full_name:'—'} (BYE)</div><div></div><div></div></div>`; }
          const w = cache.athletes.find(x=>x.id===m.whiteId), b = cache.athletes.find(x=>x.id===m.blackId);
          return `<div class="match-row">
            <div>${w?w.full_name:'—'} (brancas)</div>
            <div>${b?b.full_name:'—'} (pretas)</div>
            <div class="result-btns">
              <button class="${m.result==='1-0'?'sel':''}" onclick="recordResult('${m.id}','white')">1-0</button>
              <button class="${m.result==='0.5-0.5'?'sel':''}" onclick="recordResult('${m.id}','draw')">½-½</button>
              <button class="${m.result==='0-1'?'sel':''}" onclick="recordResult('${m.id}','black')">0-1</button>
            </div></div>`;
        }).join('') + `</div>`;
      }).join('');
  }
  return `<div class="panel"><h2>Rodadas</h2><select onchange="ui.roundsGroup=this.value; render();">${options}</select><div style="margin-top:14px;">${body}</div></div>`;
}
async function genRound(){
  const forcedByeAthleteId = document.getElementById('rd-forced-bye')?.value || null;
  try{ await api('/api/groups/'+ui.roundsGroup+'/generate-round', {method:'POST', body:JSON.stringify({forcedByeAthleteId})}); render(); }catch(e){}
}
async function undoLastRound(){
  if(!confirm('Desfazer a última rodada deste grupo? Se algum resultado já tiver sido lançado, o rating volta ao valor de antes. Essa ação não pode ser desfeita.')) return;
  try{ const r = await api('/api/groups/'+ui.roundsGroup+'/rounds/last', {method:'DELETE'}); toast(`Rodada ${r.removedRoundNumber} desfeita.`); render(); }catch(e){}
}
async function recordResult(mid, outcome){ try{ await api('/api/matches/'+mid+'/result', {method:'POST', body:JSON.stringify({outcome})}); render(); }catch(e){} }

async function renderClassificacao(){
  if(!ui.standGroup && cache.groups.length) ui.standGroup = cache.groups[0].id;
  const options = cache.groups.map(g=>{const cat=catById(g.category_id); return `<option value="${g.id}" ${ui.standGroup===g.id?'selected':''}>${cat?cat.name:''} · ${g.gender} · ${g.name}</option>`;}).join('');
  let body = '<div class="empty">Crie um grupo.</div>';
  if(ui.standGroup){
    const data = await api('/api/groups/'+ui.standGroup+'/standings');
    const roundHeaders = Array.from({length:data.maxRound},(_,i)=>`<th>R${i+1}</th>`).join('');
    body = data.rows.length===0 ? '<div class="empty">Sem atletas.</div>' : `<table><thead><tr><th>#</th><th>Atleta</th>${roundHeaders}<th>Pontos</th><th>Buchholz</th><th>Rating</th></tr></thead><tbody>
      ${data.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.fullName}</td>${r.perRound.map(s=>`<td>${s}</td>`).join('')}<td><b>${r.points}</b></td><td>${r.buchholz}</td><td>${r.rating}</td></tr>`).join('')}
    </tbody></table>`;
  }
  return `<div class="panel"><h2>Classificação</h2><select onchange="ui.standGroup=this.value; render();">${options}</select><div style="margin-top:14px;">${body}</div></div>`;
}

function renderFiscais(){
  return `
  <div class="panel">
    <h2>Novo fiscal</h2>
    <p class="desc">Crie um usuário e senha para cada fiscal, e vincule ao(s) grupo(s) que ele vai controlar no dia do torneio. O fiscal só verá e só poderá lançar resultados desse(s) grupo(s).</p>
    <div class="grid cols-4">
      <div><label>Nome completo</label><input id="uf-name" placeholder="Ex: Maria Silva"></div>
      <div><label>Usuário (login)</label><input id="uf-username" placeholder="ex: maria.silva"></div>
      <div><label>Senha</label><input id="uf-password" type="password" placeholder="mín. 4 caracteres"></div>
      <div style="display:flex; align-items:flex-end;"><button class="btn" style="width:100%;" onclick="addUser()">Criar fiscal</button></div>
    </div>
    <div style="margin-top:10px;">
      <label>Grupo(s) que este fiscal vai controlar</label>
      <select id="uf-groups" multiple style="height:120px;">
        ${cache.groups.map(g=>{const cat=catById(g.category_id); return `<option value="${g.id}">${cat?cat.name:''} · ${g.gender} · ${g.name}</option>`;}).join('')}
      </select>
      <p class="desc" style="margin-top:4px;">Segure Ctrl (ou Cmd no Mac) para selecionar mais de um grupo.</p>
    </div>
  </div>
  <div class="panel">
    <h2>Fiscais cadastrados (${cache.users.filter(u=>u.role==='fiscal').length})</h2>
    ${cache.users.filter(u=>u.role==='fiscal').length? `<table><thead><tr><th>Nome</th><th>Usuário</th><th>Grupos</th><th></th></tr></thead><tbody>
      ${cache.users.filter(u=>u.role==='fiscal').map(u=>{
        const groupNames = u.groupIds.map(gid=>{
          const g=cache.groups.find(x=>x.id===gid);
          if(!g) return '?';
          const cat=catById(g.category_id);
          return `${g.category_name||(cat?cat.name:'')} · ${g.gender} · ${g.name}`;
        }).join('; ') || '— nenhum —';
        return `<tr><td>${u.full_name||'—'}</td><td>${u.username}</td><td>${groupNames}</td>
          <td><button class="btn danger" onclick="delUser('${u.id}')">Remover</button></td></tr>`;
      }).join('')}
    </tbody></table>` : '<div class="empty">Nenhum fiscal cadastrado ainda.</div>'}
  </div>`;
}
async function addUser(){
  const fullName = document.getElementById('uf-name').value;
  const username = document.getElementById('uf-username').value;
  const password = document.getElementById('uf-password').value;
  const groupIds = Array.from(document.getElementById('uf-groups').selectedOptions).map(o=>o.value);
  try{
    await api('/api/users', {method:'POST', body: JSON.stringify({fullName, username, password, role:'fiscal', groupIds})});
    toast('Fiscal criado.');
    render();
  }catch(e){}
}
async function delUser(id){
  if(!confirm('Remover este fiscal? Ele perde o acesso imediatamente.')) return;
  try{ await api('/api/users/'+id, {method:'DELETE'}); render(); }catch(e){}
}

async function renderQuadroPublico(){
  const links = await api('/api/public-links');
  return `
  <div class="panel">
    <h2>Quadro Público por Grupo</h2>
    <p class="desc">Cada grupo abaixo tem um link e um QR Code próprios, que abrem uma tela sem login, sem controles
    de edição — só a rodada atual e a classificação, atualizando sozinha a cada 15 segundos. O QR Code é gerado
    direto pelo servidor (funciona mesmo sem internet externa no dia do torneio). Imprima e cole ao lado do quadro
    físico, ou projete o link direto.</p>
    ${links.length===0 ? '<div class="empty">Nenhum grupo disponível ainda.</div>' :
      links.map(l=>`
        <div class="public-row" style="display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;">
          <div>
            <b>${l.categoryName} · ${l.gender==='M'?'Masculino':'Feminino'} · ${l.name}</b><br>
            <a href="${l.url}" style="color:var(--ice-soft, #6fa8dc); font-size:12.5px;">${l.url}</a>
            <div class="desc" style="margin-top:2px;">Abre na mesma aba — assim o botão "← Voltar" do quadro público funciona certinho.</div>
          </div>
          <div style="background:#f3f0e8; padding:8px; border-radius:8px;">
            <img src="${l.qrUrl}" width="120" height="120" style="display:block;">
          </div>
        </div>
      `).join('')
    }
  </div>`;
}

async function renderHistorico(){
  const archives = await api('/api/tournament/archive');
  const q = ui.historyQuery || '';
  let historyResults = '';
  if(q.trim()){
    const rows = await api('/api/athletes/history?q='+encodeURIComponent(q));
    historyResults = rows.length===0 ? '<div class="empty">Nenhum atleta encontrado com esse nome.</div>' : `
      <table><thead><tr><th>Torneio</th><th>Data</th><th>Categoria</th><th>Grupo</th><th>Pontos</th><th>Rating</th></tr></thead><tbody>
        ${rows.map(r=>`<tr><td>${r.tournamentName}${r.isCurrent?' <span class="tag">em andamento</span>':''}</td><td>${r.isCurrent?'—':r.date}</td><td>${r.categoryName}</td><td>${r.groupName}</td><td>${r.points}</td><td>${r.rating}</td></tr>`).join('')}
      </tbody></table>`;
  }
  return `
  <div class="panel">
    <h2>Arquivar torneio atual</h2>
    <p class="desc">Antes de preparar a base para um novo torneio (usando a Zona de Perigo, na aba Atletas), tire uma
    "fotografia" do estado atual — nome, colégio, categoria, pontos e rating final de cada atleta. Isso preserva o
    histórico mesmo depois de você limpar os grupos/atletas para o próximo evento.</p>
    <div class="grid cols-3">
      <div><label>Nome do torneio</label><input id="arch-name" placeholder="Ex: Copa Escolar 1º Semestre 2026"></div>
      <div><label>Data</label><input id="arch-date" type="date"></div>
      <div style="display:flex; align-items:flex-end;"><button class="btn secondary" style="width:100%;" onclick="archiveTournament()">Arquivar torneio atual</button></div>
    </div>
  </div>
  <div class="panel">
    <h2>Torneios arquivados (${archives.length})</h2>
    ${archives.length===0 ? '<div class="empty">Nenhum torneio arquivado ainda.</div>' : `
    <table><thead><tr><th>Torneio</th><th>Data</th><th>Atletas</th><th></th></tr></thead><tbody>
      ${archives.map(a=>`<tr><td>${a.tournamentName}</td><td>${a.date||'—'}</td><td>${a.athleteCount}</td><td><button class="btn danger" onclick="deleteArchive('${a.id}')">Remover</button></td></tr>`).join('')}
    </tbody></table>`}
  </div>
  <div class="panel">
    <h2>Buscar evolução de um atleta</h2>
    <p class="desc">Busca pelo nome em todos os torneios arquivados + no torneio em andamento. Mantenha a grafia do nome
    parecida entre um torneio e outro para o sistema conseguir reconhecer a mesma pessoa (o CPF, quando cadastrado,
    ajuda bastante nisso também).</p>
    <input id="hist-search" placeholder="Digite o nome do atleta…" value="${q}" oninput="ui.historyQuery=this.value; debounceHistorySearch();" style="max-width:360px;">
    <div style="margin-top:14px;">${historyResults}</div>
  </div>`;
}
let historyTimer=null;
function debounceHistorySearch(){ clearTimeout(historyTimer); historyTimer=setTimeout(render, 350); }
async function archiveTournament(){
  const name = document.getElementById('arch-name').value;
  const date = document.getElementById('arch-date').value;
  try{ const r = await api('/api/tournament/archive', {method:'POST', body:JSON.stringify({name,date})}); toast(`Arquivado: ${r.athletesArchived} atleta(s).`); render(); }catch(e){}
}
async function deleteArchive(id){
  if(!confirm('Remover este torneio do histórico? Não pode ser desfeito.')) return;
  try{ await api('/api/tournament/archive/'+id, {method:'DELETE'}); render(); }catch(e){}
}

function renderExplicacoes(){
  return `
  <div class="panel">
    <h2>Como o torneio funciona — guia simples</h2>
    <p class="desc">Explicação sem jargão, para qualquer pessoa entender: como o sistema organiza o campeonato, os pontos,
    o rating e a classificação.</p>
  </div>
  <div class="panel">
    <h2>1. Categoria, Gênero e Grupo</h2>
    <p class="desc"><b>Categoria</b>: faixa de idade (ex: Sub-9, Sub-18). <b>Gênero</b>: Masculino e Feminino jogam
    separados dentro da mesma categoria. <b>Grupo</b>: dentro de categoria+gênero, os atletas podem ser divididos em
    grupos menores (ex: Grupo A, B) para reduzir o número de rodadas. Exemplo: um menino de 10 anos jogaria em
    "Sub-11 Masculino — Grupo A".</p>
  </div>
  <div class="panel">
    <h2>2. O Sistema Suíço (as 4 regras de ouro)</h2>
    <p class="desc"><b>1)</b> Ninguém é eliminado — todos jogam todas as rodadas.<br>
    <b>2)</b> Você joga contra quem tem sua pontuação (os líderes vão se encontrando aos poucos).<br>
    <b>3)</b> Nunca se repete adversário no mesmo torneio.<br>
    <b>4)</b> As cores das peças se equilibram — ninguém joga a mesma cor 3 vezes seguidas.<br>
    <b>BYE</b> é a folga de quem sobra quando o número de jogadores é ímpar — ganha 1 ponto de graça, e nunca folga duas vezes.</p>
  </div>
  <div class="panel">
    <h2>3. Pontuação</h2>
    <p class="desc">Vitória = <b>1 ponto</b>. Empate = <b>½ ponto</b> para cada. Derrota = <b>0</b>. A soma decide a Classificação.</p>
  </div>
  <div class="panel">
    <h2>4. Rating (Elo) e Fator K</h2>
    <p class="desc">Todo atleta começa com um número de força (rating, normalmente 1500). Vencer alguém mais forte rende
    mais pontos de rating do que vencer alguém mais fraco. O quanto varia depende da faixa do atleta:</p>
    <table><thead><tr><th>Faixa</th><th>Fator K</th><th>Efeito</th></tr></thead><tbody>
      <tr><td>Iniciante</td><td>40</td><td>Rating muda bastante — ajuda a achar o nível real rápido</td></tr>
      <tr><td>Regular</td><td>20</td><td>Variação moderada</td></tr>
      <tr><td>Mestre</td><td>10</td><td>Rating muda pouco — mais estável</td></tr>
    </tbody></table>
    <p class="desc" style="margin-top:8px;"><b>Exemplo prático:</b> um Iniciante de rating 1500 que vence um adversário de 1700 ganha cerca de 30 pontos de rating de uma vez (porque a vitória era pouco provável). Se o mesmo Iniciante vencesse alguém de 1300, ganharia só uns 10 pontos (era o esperado).</p>
  </div>
  <div class="panel">
    <h2>5. Critérios de desempate</h2>
    <p class="desc"><b>1º Buchholz:</b> soma a pontuação final de todos os adversários que o atleta enfrentou — prestigia
    quem jogou contra adversários mais fortes.<br><b>2º Vitórias:</b> quem venceu mais partidas (em vez de empatar) fica
    na frente.<br><b>3º Rating:</b> em último caso, desempata pelo rating.</p>
  </div>
  <div class="panel">
    <h2>6. Quadro Público e Histórico</h2>
    <p class="desc">Cada grupo tem um QR Code próprio (aba Quadro Público) que mostra a classificação em tempo real,
    sem precisar de login. O Histórico (aba própria) guarda a evolução de cada atleta entre torneios diferentes ao
    longo do ano.</p>
  </div>`;
}

render();
</script>
</body>
</html>
